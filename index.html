<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>竞赛推荐</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --purple-1: #4e3fc4;
    --purple-2: #7b52d6;
    --purple-3: #c06bd8;
    --btn-purple-1: #5b4bd6;
    --btn-purple-2: #7d5ee0;
    --text-dark: #2b2f38;
    --text-gray: #5b6270;
    --text-light: #8a91a0;
    --border: #ececf3;
    --page-bg: #eef0fa;
    --green-1: #33cf57;
    --green-2: #5be07f;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: var(--page-bg);
    color: var(--text-dark);
    padding: 20px;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 940px;
    margin: 0 auto;
    background: #fff;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(60, 60, 120, 0.08);
  }

  .hidden { display: none !important; }

  /* ---------- Header ---------- */
  .header {
    background: linear-gradient(100deg, var(--purple-1) 0%, var(--purple-2) 55%, var(--purple-3) 100%);
    padding: 20px 26px;
  }
  .header .title-chip {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: rgba(255, 255, 255, 0.16);
    padding: 8px 18px;
    border-radius: 10px;
    color: #fff;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .header .title-chip .emoji { font-size: 20px; }

  /* ---------- Intro ---------- */
  .intro {
    padding: 22px 26px 6px;
    color: var(--text-gray);
    font-size: 15px;
    line-height: 1.9;
  }

  /* ---------- Filter pills ---------- */
  .filters {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 26px 20px;
    flex-wrap: wrap;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    background: #fff;
    text-decoration: none;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  .pill:hover { transform: scale(1.05); }
  .pill.special {
    background: linear-gradient(90deg, #f5a623, #f7c948);
    color: #fff;
    box-shadow: 0 4px 12px rgba(245, 166, 35, 0.3);
  }
  .pill.first { color: #4d7de0; border: 1.5px solid #bcd0f7; }
  .pill.second { color: #2fb59a; border: 1.5px solid #b3e6d9; }
  .pill.total {
    color: var(--text-gray);
    font-weight: 600;
    cursor: pointer;
    padding-left: 4px;
  }
  .pill.total:hover { transform: scale(1.05); }

  /* ---------- Cards ---------- */
  .cards { padding: 0 26px 26px; display: flex; flex-direction: column; gap: 20px; }

  .card {
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 22px;
    background: #fff;
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    box-shadow: 0 2px 8px rgba(60, 60, 120, 0.04);
  }
  .card:hover {
    transform: scale(1.05);
    box-shadow: 0 10px 28px rgba(60, 60, 120, 0.12);
  }

  .card-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
  }
  .card-title {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 19px;
    font-weight: 700;
    color: var(--text-dark);
  }
  .card-title .emoji { font-size: 20px; }

  .badge {
    flex-shrink: 0;
    padding: 5px 15px;
    border-radius: 8px;
    color: #fff;
    font-size: 13px;
    font-weight: 700;
  }
  .badge.purple { background: linear-gradient(90deg, #6a6ae8, #8a6ae8); }
  .badge.gold { background: linear-gradient(90deg, #f5a623, #f7c948); }

  /* progress */
  .match-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
  }
  .match-label { font-size: 14px; color: var(--text-gray); white-space: nowrap; }
  .match-bar {
    flex: 1;
    height: 12px;
    background: #eef0f4;
    border-radius: 8px;
    overflow: hidden;
  }
  .match-fill {
    height: 100%;
    border-radius: 8px;
    background: linear-gradient(90deg, var(--green-1), var(--green-2));
  }
  .match-pct { font-size: 14px; color: var(--text-gray); font-weight: 600; min-width: 42px; text-align: right; }

  /* info grid */
  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    row-gap: 15px;
    column-gap: 20px;
    margin-bottom: 20px;
  }
  .info-item {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 14.5px;
    color: var(--text-gray);
  }
  .info-item .ic { font-size: 16px; width: 18px; text-align: center; }
  .info-item .stars { letter-spacing: 1px; color: #f5b301; }

  /* buttons */
  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 14px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: 46px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    text-decoration: none;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  .btn:hover { transform: scale(1.05); }
  .btn.primary {
    background: linear-gradient(90deg, var(--btn-purple-1), var(--btn-purple-2));
    color: #fff;
    box-shadow: 0 6px 16px rgba(91, 75, 214, 0.28);
  }
  .btn.ghost {
    background: #f3f4f8;
    color: #c2c6cf;
    cursor: default;
  }
  .btn.ghost:hover { transform: none; }
  .btn.outline {
    background: #fff;
    border: 1px solid #dfe2ea;
    color: var(--text-gray);
  }

  /* ==================================================
     Detail view
     ================================================== */
  .detail-header {
    background: linear-gradient(100deg, var(--purple-1) 0%, var(--purple-2) 55%, var(--purple-3) 100%);
    padding: 16px 26px 22px;
  }
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: rgba(255, 255, 255, 0.9);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    background: none;
    border: none;
    padding: 4px 2px;
    margin-bottom: 12px;
    transition: transform 0.18s ease;
  }
  .back-link:hover { transform: scale(1.05); color: #fff; }
  .detail-title {
    color: #fff;
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 16px;
    letter-spacing: 0.5px;
  }
  .detail-tags { display: flex; flex-wrap: wrap; gap: 12px; }
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: rgba(255, 255, 255, 0.18);
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    padding: 7px 15px;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.18s ease;
  }
  .tag:hover { transform: scale(1.05); }
  .tag .ic { font-size: 15px; }

  .detail-body { padding: 24px 26px 30px; }
  .section-title {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 18px;
    font-weight: 700;
    color: var(--text-dark);
    margin-bottom: 18px;
  }
  .info-table { display: flex; flex-direction: column; gap: 10px; }
  .info-row {
    display: grid;
    grid-template-columns: 132px 1fr;
    align-items: center;
    gap: 14px;
  }
  .info-row .lab {
    background: #f4f5f9;
    color: var(--text-gray);
    font-size: 14.5px;
    padding: 11px 16px;
    border-radius: 8px;
  }
  .info-row .val {
    color: var(--text-dark);
    font-size: 14.5px;
    font-weight: 600;
    padding: 4px 2px;
    line-height: 1.7;
  }
  .info-row .val.highlight { color: #4d7de0; }

  @media (max-width: 640px) {
    .info-grid { grid-template-columns: 1fr; }
    .actions { grid-template-columns: 1fr; }
    .card-title { font-size: 16px; }
    .detail-title { font-size: 20px; }
    .info-row { grid-template-columns: 104px 1fr; }
  }
</style>
</head>
<body>
  <div class="app">
    <div id="view-list"></div>
    <div id="view-detail" class="hidden"></div>
  </div>

  <script>
    /* =========================================================
       DIFY DATA INJECTION POINT
       ---------------------------------------------------------
       Dify 会把工作流输出的 JSON 注入到 window.DIFY_DATA。
       如果没有注入，则使用下面的示例数据 (SAMPLE_DATA) 渲染。
       ========================================================= */
    /*__DIFY_DATA__*/   // Dify 可在此处注入： window.DIFY_DATA = {...};

    const SAMPLE_DATA = {
      "title": "为您推荐 5 项竞赛",
      "description": "基于您的画像（计算机·大三·GPA3.6·数模省一），从《2025 竞赛纲要》白名单中匹配到 5 项高匹配度竞赛，按推免加分权重与专业匹配度综合排序：",
      "filters": [
        { "label": "特级", "count": 1, "level": "special", "url": "" },
        { "label": "一级", "count": 2, "level": "first", "url": "" },
        { "label": "二级", "count": 2, "level": "second", "url": "" }
      ],
      "totalLabel": "全部 5 项",
      "totalUrl": "",
      "competitions": [
        {
          "icon": "🏅",
          "name": "中国高校计算机大赛 - 人工智能创意赛",
          "badge": "特级",
          "badgeStyle": "purple",
          "matchLabel": "专业匹配",
          "matchPercent": 95,
          "deadline": "2026-06-30",
          "period": "2-3 个月",
          "team": "1-3 人",
          "difficulty": 4,
          "bonus": "6 分 (国一)",
          "organizer": "全国高等学校计算机教育研究会",
          "registerUrl": "",
          "detail": {
            "title": "中国高校计算机大赛 - 人工智能创意赛",
            "tags": [
              { "icon": "🥇", "label": "一级竞赛" },
              { "icon": "✅", "label": "官方白名单" },
              { "icon": "💻", "label": "计算机类" },
              { "icon": "👥", "label": "团队赛" }
            ],
            "sections": [
              {
                "icon": "📋",
                "title": "基本信息",
                "rows": [
                  { "label": "竞赛全称", "value": "中国高校计算机大赛 - 人工智能创意赛（C4-AI）" },
                  { "label": "主办方", "value": "全国高等学校计算机教育研究会" },
                  { "label": "竞赛级别", "value": "一级（推免加分 6 分）", "highlight": true },
                  { "label": "报名截止", "value": "2026-06-30 23:59" },
                  { "label": "比赛时间", "value": "初赛：2026-08-01 ～ 08-15　　决赛：2026-10-15 ～ 10-20" },
                  { "label": "参赛形式", "value": "团队赛（1-3 人），可跨校组队" },
                  { "label": "报名费用", "value": "免费" }
                ]
              }
            ]
          }
        },
        {
          "icon": "🏆",
          "name": "“挑战杯”全国大学生课外学术科技作品竞赛",
          "badge": "特级",
          "badgeStyle": "gold",
          "matchLabel": "专业匹配",
          "matchPercent": 88,
          "deadline": "2026-04-15",
          "period": "6 个月+",
          "team": "1-8 人",
          "difficulty": 5,
          "bonus": "8 分 (国特)",
          "organizer": "共青团中央、中国科协、教育部",
          "registerUrl": "",
          "detail": {
            "title": "“挑战杯”全国大学生课外学术科技作品竞赛",
            "tags": [
              { "icon": "🥇", "label": "特级竞赛" },
              { "icon": "✅", "label": "官方白名单" },
              { "icon": "🎓", "label": "综合类" },
              { "icon": "👥", "label": "团队赛" }
            ],
            "sections": [
              {
                "icon": "📋",
                "title": "基本信息",
                "rows": [
                  { "label": "竞赛全称", "value": "“挑战杯”全国大学生课外学术科技作品竞赛" },
                  { "label": "主办方", "value": "共青团中央、中国科协、教育部" },
                  { "label": "竞赛级别", "value": "特级（推免加分 8 分）", "highlight": true },
                  { "label": "报名截止", "value": "2026-04-15 23:59" },
                  { "label": "比赛时间", "value": "校赛：2026-05　　省赛：2026-07　　国赛：2026-11" },
                  { "label": "参赛形式", "value": "团队赛（1-8 人），可跨校组队" },
                  { "label": "报名费用", "value": "免费" }
                ]
              }
            ]
          }
        }
      ]
    };

    // 默认兜底跳转链接（尚未给出真实链接前，统一跳百度）
    const FALLBACK_URL = "https://www.baidu.com";

    const data = (window.DIFY_DATA && typeof window.DIFY_DATA === "object")
      ? window.DIFY_DATA
      : SAMPLE_DATA;

    // ---------- helpers ----------
    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
    function url(u) { return esc(u || FALLBACK_URL); }
    function stars(n) {
      n = Math.max(0, Math.min(5, Number(n) || 0));
      return "★".repeat(n) + "☆".repeat(5 - n);
    }
    function go(u) { window.open(u || FALLBACK_URL, "_blank"); }

    // ---------- list view ----------
    function renderList() {
      const filtersHtml = (data.filters || []).map(f => `
        <a class="pill ${esc(f.level)}" href="${url(f.url)}" target="_blank"
           onclick="event.stopPropagation()">
          <span class="emoji">🏅</span>${esc(f.label)} (${esc(f.count)})
        </a>`).join("");

      const cardsHtml = (data.competitions || []).map((c, i) => `
        <div class="card" onclick="showDetail(${i})">
          <div class="card-head">
            <div class="card-title"><span class="emoji">${esc(c.icon || "🏅")}</span>${esc(c.name)}</div>
            <span class="badge ${esc(c.badgeStyle || "purple")}">${esc(c.badge || "")}</span>
          </div>

          <div class="match-row">
            <span class="match-label">${esc(c.matchLabel || "专业匹配")}</span>
            <div class="match-bar"><div class="match-fill" style="width:${Number(c.matchPercent) || 0}%"></div></div>
            <span class="match-pct">${Number(c.matchPercent) || 0}%</span>
          </div>

          <div class="info-grid">
            <div class="info-item"><span class="ic">📅</span>报名截止：${esc(c.deadline)}</div>
            <div class="info-item"><span class="ic">⏱️</span>备赛周期：${esc(c.period)}</div>
            <div class="info-item"><span class="ic">👥</span>团队：${esc(c.team)}</div>
            <div class="info-item"><span class="ic" style="color:#33cf57">📊</span>难度系数：<span class="stars">${stars(c.difficulty)}</span></div>
            <div class="info-item"><span class="ic">🏆</span>推免加分：${esc(c.bonus)}</div>
            <div class="info-item"><span class="ic" style="color:#e5533d">📍</span>主办方：${esc(c.organizer)}</div>
          </div>

          <div class="actions">
            <button class="btn primary" onclick="event.stopPropagation(); showDetail(${i})">📋 查看详情</button>
            <span class="btn ghost" onclick="event.stopPropagation()"></span>
            <a class="btn outline" href="${url(c.registerUrl)}" target="_blank"
               onclick="event.stopPropagation()">🔗 报名入口</a>
          </div>
        </div>`).join("");

      document.getElementById("view-list").innerHTML = `
        <div class="header">
          <div class="title-chip"><span class="emoji">🏆</span>${esc(data.title)}</div>
        </div>
        <div class="intro">${esc(data.description)}</div>
        <div class="filters">
          ${filtersHtml}
          <a class="pill total" href="${url(data.totalUrl)}" target="_blank"
             onclick="event.stopPropagation()">${esc(data.totalLabel || "全部")}</a>
        </div>
        <div class="cards">${cardsHtml}</div>
      `;
    }

    // ---------- detail view ----------
    function renderDetail(i) {
      const c = (data.competitions || [])[i] || {};
      const d = c.detail || {};

      const tagsHtml = (d.tags || []).map(t => `
        <span class="tag"><span class="ic">${esc(t.icon || "")}</span>${esc(t.label)}</span>
      `).join("");

      const sectionsHtml = (d.sections || []).map(sec => `
        <div class="section-title"><span>${esc(sec.icon || "📋")}</span>${esc(sec.title)}</div>
        <div class="info-table">
          ${(sec.rows || []).map(r => `
            <div class="info-row">
              <div class="lab">${esc(r.label)}</div>
              <div class="val ${r.highlight ? "highlight" : ""}">${esc(r.value)}</div>
            </div>`).join("")}
        </div>
      `).join("");

      document.getElementById("view-detail").innerHTML = `
        <div class="detail-header">
          <button class="back-link" onclick="showList()">← 返回推荐列表</button>
          <div class="detail-title">${esc(d.title || c.name)}</div>
          <div class="detail-tags">${tagsHtml}</div>
        </div>
        <div class="detail-body">${sectionsHtml}</div>
      `;
    }

    // ---------- navigation ----------
    function showDetail(i) {
      renderDetail(i);
      document.getElementById("view-list").classList.add("hidden");
      document.getElementById("view-detail").classList.remove("hidden");
      window.scrollTo(0, 0);
    }
    function showList() {
      document.getElementById("view-detail").classList.add("hidden");
      document.getElementById("view-list").classList.remove("hidden");
      window.scrollTo(0, 0);
    }

    // 初始渲染列表
    renderList();
  </script>
</body>
</html>
